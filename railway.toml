[build]
builder = "nixpacks"
buildCommand = "npm run build"

[deploy]
startCommand = "npx prisma db push || true; (npx tsx prisma/clear-demo.ts || echo 'clear-demo skipped'); (npx tsx prisma/data-migrations.ts || echo 'data migrations skipped'); npm run start"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
